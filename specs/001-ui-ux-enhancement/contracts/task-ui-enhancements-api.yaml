openapi: 3.0.0
info:
  title: Task UI Enhancements API for Todo App
  description: API for UI/UX enhancement features related to tasks
  version: 1.0.0
servers:
  - url: http://localhost:8000/api
    description: Development server

paths:
  /tasks/search:
    get:
      summary: Search tasks
      description: Search and filter tasks with enhanced UI capabilities
      parameters:
        - name: q
          in: query
          required: false
          description: Search query string
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Filter by task status
          schema:
            type: string
            enum: [all, pending, completed]
        - name: priority
          in: query
          required: false
          description: Filter by task priority
          schema:
            type: string
            enum: [low, medium, high, all]
        - name: sort
          in: query
          required: false
          description: Sort order
          schema:
            type: string
            enum: [title, created_at, due_date, priority]
        - name: order
          in: query
          required: false
          description: Sort direction
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: limit
          in: query
          required: false
          description: Number of results to return
          schema:
            type: integer
            default: 50
            maximum: 100
        - name: offset
          in: query
          required: false
          description: Number of results to skip
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Search results with enhanced task data
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
                  total:
                    type: integer
                    description: Total number of tasks matching the search
                  limit:
                    type: integer
                    description: Number of tasks returned
                  offset:
                    type: integer
                    description: Number of tasks skipped
        '401':
          description: Unauthorized - user not authenticated

  /tasks/{task_id}/position:
    put:
      summary: Update task position
      description: Update the position of a task for UI ordering (drag-and-drop functionality)
      parameters:
        - name: task_id
          in: path
          required: true
          description: ID of the task to update
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - position
              properties:
                position:
                  type: integer
                  description: New position for the task
      responses:
        '200':
          description: Task position updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Invalid position provided
        '401':
          description: Unauthorized - user not authenticated
        '404':
          description: Task not found

  /tasks/stats:
    get:
      summary: Get task statistics
      description: Retrieve task statistics for UI progress tracking
      responses:
        '200':
          description: Task statistics for the authenticated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_tasks:
                    type: integer
                    description: Total number of tasks
                  completed_tasks:
                    type: integer
                    description: Number of completed tasks
                  pending_tasks:
                    type: integer
                    description: Number of pending tasks
                  completion_percentage:
                    type: number
                    format: float
                    minimum: 0
                    maximum: 100
                    description: Percentage of tasks completed
                  high_priority_tasks:
                    type: integer
                    description: Number of high priority tasks
                  overdue_tasks:
                    type: integer
                    description: Number of overdue tasks
        '401':
          description: Unauthorized - user not authenticated

components:
  schemas:
    Task:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the task
        title:
          type: string
          description: Task title
        description:
          type: string
          description: Task description
        completed:
          type: boolean
          description: Task completion status
        created_at:
          type: string
          format: date-time
          description: Timestamp when task was created
        updated_at:
          type: string
          format: date-time
          description: Timestamp when task was last updated
        user_id:
          type: string
          description: ID of the user who owns the task
        due_date:
          type: string
          format: date-time
          description: Optional due date for the task
        priority:
          type: string
          enum: [low, medium, high]
          description: Task priority level
        position:
          type: integer
          description: Position for ordering tasks in UI
      required:
        - id
        - title
        - completed
        - created_at
        - updated_at
        - user_id
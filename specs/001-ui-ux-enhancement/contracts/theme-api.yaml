openapi: 3.0.0
info:
  title: Theme API for Todo App
  description: API for managing user theme preferences
  version: 1.0.0
servers:
  - url: http://localhost:8000/api
    description: Development server

paths:
  /users/theme:
    get:
      summary: Get user's theme preference
      description: Retrieve the current theme preference for the authenticated user
      responses:
        '200':
          description: User's theme preference
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                    description: ID of the user
                  theme_mode:
                    type: string
                    enum: [light, dark, system]
                    description: Current theme mode preference
                  updated_at:
                    type: string
                    format: date-time
                    description: Last updated timestamp
        '401':
          description: Unauthorized - user not authenticated
    put:
      summary: Update user's theme preference
      description: Update the theme preference for the authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - theme_mode
              properties:
                theme_mode:
                  type: string
                  enum: [light, dark, system]
                  description: New theme mode preference
      responses:
        '200':
          description: Theme preference updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                    description: ID of the user
                  theme_mode:
                    type: string
                    enum: [light, dark, system]
                    description: Updated theme mode preference
                  updated_at:
                    type: string
                    format: date-time
                    description: Last updated timestamp
        '400':
          description: Invalid theme mode provided
        '401':
          description: Unauthorized - user not authenticated